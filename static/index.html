<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLN Marg Traffic AI Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,255,128,0.2); }
        h1 { color: #00ff80; }
        .metric-box { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .metric { font-size: 24px; font-weight: bold; }
        .value { color: #00ff80; font-size: 32px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🟢 JLN Marg Autonomous Traffic AI</h1>
        <div class="metric-box">
            <div class="metric">Current Queue: <br><span class="value" id="currentQueue">0</span></div>
            <div class="metric">AI Reward Score: <br><span class="value" id="currentReward">0</span></div>
        </div>
        <canvas id="trafficChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('trafficChart').getContext('2d');
        const trafficChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Waiting Cars (Queue)', borderColor: '#00ff80', backgroundColor: 'rgba(0, 255, 128, 0.1)', data: [], fill: true }] },
            options: { responsive: true, scales: { y: { beginAtZero: true, grid: { color: '#333' } }, x: { grid: { color: '#333' } } } }
        });

        async function fetchMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();
                if (data.length > 0) {
                    const latest = data[data.length - 1];
                    document.getElementById('currentQueue').innerText = latest.queue_length;
                    document.getElementById('currentReward').innerText = latest.reward;

                    trafficChart.data.labels = data.map(d => d.timestamp);
                    trafficChart.data.datasets[0].data = data.map(d => d.queue_length);
                    trafficChart.update();
                }
            } catch (error) { console.error("Error fetching data:", error); }
        }
        setInterval(fetchMetrics, 2000); // Pull new data every 2 seconds
    </script>
</body>
</html>
